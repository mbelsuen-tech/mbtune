name: Compilar MBTune (exe + dmg)
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean mbtune.spec
      - uses: actions/upload-artifact@v4
        with:
          name: MBTune-Windows
          path: dist/MBTune.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MBTune-macOS
          path: dist/MBTune.dmg
