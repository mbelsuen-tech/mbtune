name: Compilar MBMix (exe + dmg)
on:
  workflow_dispatch:
  push:
    branches: [main, claude/mixing-station-replica-mdhe1q]
    paths:
      - "mbmix/**"
      - "mbmix.spec"
      - "build_mbmix_*"
      - ".github/workflows/build-mbmix.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pywebview pyinstaller
      - run: python -m PyInstaller --noconfirm --clean mbmix.spec
      - uses: actions/upload-artifact@v4
        with:
          name: MBMix-Windows
          path: dist/MBMix.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash build_mbmix_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MBMix-macOS
          path: dist/MBMix.dmg
