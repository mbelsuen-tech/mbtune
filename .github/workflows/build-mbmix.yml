name: Compilar MBMix (exe + dmg)
on:
  workflow_dispatch:
  push:
    branches: [main, claude/mixing-station-replica-mdhe1q]
    paths:
      - "mbmix/**"
      - "mbmix.spec"
      - "build_mbmix_*"
      - "ios/**"
      - ".github/workflows/build-mbmix.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publicar la web instalable en GitHub Pages (rama gh-pages)
        run: |
          mkdir site && cp -R mbmix/web/. site/ && touch site/.nojekyll
          cd site && git init -q -b gh-pages && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Publicar MBMix ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pywebview pyinstaller
      - run: python -m PyInstaller --noconfirm --clean mbmix.spec
      - uses: actions/upload-artifact@v4
        with:
          name: MBMix-Windows
          path: dist/MBMix.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash build_mbmix_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MBMix-macOS
          path: dist/MBMix.dmg

  ipad:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - name: Compilar la app del iPad (sin firmar)
        run: |
          xcodebuild -project ios/MBMix.xcodeproj -target MBMix -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SYMROOT="$PWD/ios/build" build > build.log 2>&1 \
            || { grep -E "error:|warning: .*Swift" -A3 build.log | head -120; tail -60 build.log; exit 1; }
          tail -5 build.log
          test -d ios/build/Release-iphoneos/MBMix.app
      - name: Empaquetar .ipa y proyecto de Xcode
        run: |
          mkdir -p Payload && cp -R ios/build/Release-iphoneos/MBMix.app Payload/
          zip -qry MBMix-iPad-sin-firmar.ipa Payload
          rm -rf ios/build && zip -qry MBMix-Xcode.zip ios mbmix/web
      - uses: actions/upload-artifact@v4
        with:
          name: MBMix-iPad
          path: |
            MBMix-iPad-sin-firmar.ipa
            MBMix-Xcode.zip
