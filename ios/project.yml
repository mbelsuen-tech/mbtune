# Proyecto de Xcode para MBMix (iPad). Se genera con XcodeGen:  brew install xcodegen && xcodegen generate
name: MBMix
options:
  bundleIdPrefix: com.mbsoundtools
  deploymentTarget:
    iOS: "16.0"
targets:
  MBMix:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: MBMix
      - path: ../mbmix/web
        type: folder
        buildPhase: resources
    info:
      path: MBMix/Info.plist
      properties:
        CFBundleDisplayName: MBMix
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: MBMix necesita la red local para controlar tu mesa de mezclas (WING o XR18).
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mbsoundtools.mbmix
        PRODUCT_NAME: MBMix
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
